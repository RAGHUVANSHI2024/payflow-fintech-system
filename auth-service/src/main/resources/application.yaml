spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:mysql://localhost:3306/auth_db
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: mysql


  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

server:
  port: 8081

  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka